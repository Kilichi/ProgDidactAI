services:
    web:
        build: .
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            DATA_DRIVER: mongodb
            MONGODB_URI: mongodb://mongo:27017
            MONGODB_DB: progdidactai
            DATA_DIR: /app/data
            AI_PROVIDER: ${AI_PROVIDER:-local}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
            GROQ_API_KEY: ${GROQ_API_KEY:-}
            GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
        volumes:
            - documents:/app/data
        depends_on:
            mongo:
                condition: service_healthy
        restart: unless-stopped
    mongo:
        image: mongo:7
        volumes:
            - database:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    database:
    documents:
